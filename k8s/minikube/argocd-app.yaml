apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fabrication-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aziz-rmili/aziz-rmili-fabrication-management-devops.git
    targetRevision: main
    path: k8s/minikube
  destination:
    server: https://kubernetes.default.svc
    namespace: fabrication
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
