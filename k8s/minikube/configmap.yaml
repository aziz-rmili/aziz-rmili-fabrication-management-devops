apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fabrication
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/fabrication_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  LOG_LEVEL: "INFO"
