# ==============================================================
# PROFIL TEST — utilisé uniquement pendant les tests CI/CD
# Remplace MySQL par H2 (base en mémoire)
# Aucune connexion externe requise → pipeline CI fonctionne sans DB
# ==============================================================

# Base H2 en mémoire (disparaît après les tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA : H2 dialect + recréation des tables à chaque test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Console H2 (optionnel, pour debug local)
spring.h2.console.enabled=true
