# ==============================================================
# COURS DU PROF - SLIDE 10 :
# "Configuration du application.properties pour la connexion au SGBD"
# ==============================================================


# ==============================================================
# 1. CONNEXION A MYSQL
# Ton prof écrit dans son cours :
#   spring.datasource.url=jdbc:mysql://localhost:3306/nom_de_ta_base
#                                       ?createDatabaseIfNotExist=true
# On adapte pour notre projet :
# ==============================================================

# URL de connexion MySQL
# - localhost   : MySQL est sur ta machine
# - 3306        : port par défaut de MySQL
# - fabrication_db : nom de la base de données (à créer dans MySQL)
# - createDatabaseIfNotExist=true : crée la base si elle n'existe pas
# - serverTimezone=UTC : évite les erreurs de fuseau horaire
spring.datasource.url=jdbc:mysql://localhost:3306/fabrication_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root


# ==============================================================
# 2. CONFIGURATION JPA / HIBERNATE
# Ton prof explique slide 11 les valeurs possibles de ddl-auto
# ==============================================================

# Comportement de Hibernate vis-à-vis des tables :
# - create      : SUPPRIME et RECRÉE les tables à chaque démarrage
#                 (données perdues !)
# - update      : CRÉE les tables si elles n'existent pas,
#                 MODIFIE si les entités changent (recommandé en dev)
# - validate    : vérifie que les tables correspondent aux entités
#                 mais ne modifie rien (recommandé en production)
# - create-drop : crée au démarrage, supprime à l'arrêt (pour tests)
#
# Ton prof dans son cours : spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL générées par Hibernate dans la console
# Ton prof dans son cours : spring.jpa.show-sql=true
# Très utile pour déboguer et comprendre ce que fait Hibernate !
spring.jpa.show-sql=true

# Formate les requêtes SQL pour les rendre lisibles
spring.jpa.properties.hibernate.format_sql=true


# ==============================================================
# 3. CONFIGURATION SWAGGER
# Documentation interactive accessible sur :
# http://localhost:8080/swagger-ui.html
# ==============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs


# ==============================================================
# 4. CONFIGURATION DU SERVEUR
# ==============================================================

# Port sur lequel Spring Boot écoute (8080 par défaut)
server.port=8080
