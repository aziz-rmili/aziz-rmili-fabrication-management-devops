<div class="page-header">
  <div>
    <h1 class="page-title">Employés</h1>
    <p class="page-sub">Gestion du personnel et des affectations</p>
  </div>
  <button class="btn-primary-custom" (click)="openCreate()">
    <i class="bi bi-plus-lg"></i> Nouvel employé
  </button>
</div>
 
<div class="card-custom">
  <table class="table-custom">
    <thead>
      <tr>
        <th>Employé</th>
        <th>Poste</th>
        <th>Machine assignée</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of employes">
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="avatar">{{ e.nom.charAt(0).toUpperCase() }}</div>
            <strong>{{ e.nom }}</strong>
          </div>
        </td>
        <td>{{ e.poste }}</td>
        <td>
          <span [class]="e.machineAssignee ? 'badge-en-cours' : 'badge-en-attente'">
            {{ getMachineName(e) }}
          </span>
        </td>
        <td>
          <button class="btn-action" (click)="openEdit(e)" title="Modifier">
            <i class="bi bi-pencil" style="color:#3b82f6"></i>
          </button>
          <button class="btn-action" (click)="delete(e.id!)" title="Supprimer">
            <i class="bi bi-trash" style="color:#ef4444"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="employes.length === 0">
        <td colspan="4">
          <div class="empty-state">
            <i class="bi bi-people"></i>
            Aucun employé enregistré
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
 
<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <h3>{{ isEditing ? 'Modifier l\'employé' : 'Nouvel employé' }}</h3>
    <div class="form-group">
      <label>Nom complet</label>
      <input [(ngModel)]="form.nom" placeholder="Ex: Ali Ben Salah" />
    </div>
    <div class="form-group">
      <label>Poste</label>
      <input [(ngModel)]="form.poste" placeholder="Ex: Opérateur" />
    </div>
    <div class="form-group">
      <label>Machine assignée (optionnel)</label>
      <select [(ngModel)]="selectedMachineId">
        <option [ngValue]="null">-- Aucune machine --</option>
        <option *ngFor="let m of machines" [ngValue]="m.id">{{ m.nom }}</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" (click)="showModal=false">Annuler</button>
      <button class="btn-primary-custom" (click)="save()" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : (isEditing ? 'Modifier' : 'Créer') }}
      </button>
    </div>
  </div>
</div>
