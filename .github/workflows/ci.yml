name: CI Pipeline — Fabrication Management

on:
  push:
    branches: [ main, dev, 'feat/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:

  # ============================================
  # JOB 1 : Backend — Test + Build + SonarQube
  # ============================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies
        run: cd backend && mvn dependency:go-offline

      - name: Run unit tests
        run: cd backend && mvn test -Dspring.datasource.url=jdbc:h2:mem:testdb -Dspring.datasource.driver-class-name=org.h2.Driver -Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect

      - name: Build JAR
        run: cd backend && mvn clean package -DskipTests

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'fabrication-backend'
          path: 'backend'
          format: 'HTML'
          args: >
            --failOnCVSS 9
            --enableRetired

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports/

      - name: SonarQube Analysis
        run: |
          cd backend && mvn sonar:sonar \
            -Dsonar.projectKey=aziz-rmili-fabrication-management-devops \
            -Dsonar.organization=aziz-rmili \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  # ============================================
  # JOB 2 : Frontend — Lint + Build
  # ============================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run lint
        run: cd frontend && npx ng lint

      - name: Build Angular
        run: cd frontend && npx ng build --configuration=production

  # ============================================
  # JOB 3 : Docker — Build + Trivy + Push
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend image
        run: |
          docker build \
            -t shazzam/fabrication-backend:${{ github.sha }} \
            -t shazzam/fabrication-backend:latest \
            ./backend

      - name: Build Frontend image
        run: |
          docker build \
            -t shazzam/fabrication-frontend:${{ github.sha }} \
            -t shazzam/fabrication-frontend:latest \
            ./frontend

      - name: Trivy scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shazzam/fabrication-backend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Trivy scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shazzam/fabrication-frontend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push Backend image
        run: |
          docker push shazzam/fabrication-backend:${{ github.sha }}
          docker push shazzam/fabrication-backend:latest

      - name: Push Frontend image
        run: |
          docker push shazzam/fabrication-frontend:${{ github.sha }}
          docker push shazzam/fabrication-frontend:latest
