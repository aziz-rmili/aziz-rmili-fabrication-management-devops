name: CI Pipeline — Fabrication Management

on:
  push:
    branches: [ main, dev, 'feat/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:

  # ============================================
  # JOB 1 : Backend Spring Boot
  # ============================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Installer les dépendances
        run: cd backend && mvn dependency:go-offline -q

      - name: 4. Lancer les tests unitaires
        run: |
          cd backend && mvn test \
            -Dspring.datasource.url=jdbc:h2:mem:testdb \
            -Dspring.datasource.driver-class-name=org.h2.Driver \
            -Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect

      - name: 5. Construire le JAR
        run: cd backend && mvn clean package -DskipTests

      - name: 6. Analyser avec SonarQube
        run: |
          cd backend && mvn sonar:sonar \
            -Dsonar.projectKey=aziz-rmili-fabrication-management-devops \
            -Dsonar.organization=aziz-rmili \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: 7. Vérification dépendances
        run: cd backend && mvn dependency:tree -DoutputType=dot > /dev/null 

  # ============================================
  # JOB 2 : Frontend Angular
  # ============================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Installer les dépendances
        run: cd frontend && npm ci

      - name: 4. Lancer ESLint
        run: cd frontend && npx ng lint

      - name: 5. Construire Angular
        run: cd frontend && npx ng build --configuration=production

  # ============================================
  # JOB 3 : Docker — Build + Trivy + Push
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Construire image Backend
        run: |
          docker build \
            -t shazzam/fabrication-backend:${{ github.sha }} \
            -t shazzam/fabrication-backend:latest \
            ./backend

      - name: 4. Construire image Frontend
        run: |
          docker build \
            -t shazzam/fabrication-frontend:${{ github.sha }} \
            -t shazzam/fabrication-frontend:latest \
            ./frontend

      - name: 5. Scan Trivy Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shazzam/fabrication-backend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: 6. Scan Trivy Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shazzam/fabrication-frontend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: 7. Push Backend sur DockerHub
        run: |
          docker push shazzam/fabrication-backend:${{ github.sha }}
          docker push shazzam/fabrication-backend:latest

      - name: 8. Push Frontend sur DockerHub
        run: |
          docker push shazzam/fabrication-frontend:${{ github.sha }}
          docker push shazzam/fabrication-frontend:latest
